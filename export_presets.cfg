[preset.0]

name="Android G3-B Debug"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Gameplay resources only: docs, tests and tooling must never ship in the APK.
exclude_filter="docs/*, tests/*, tools/*"
export_path="build/layer-sort-g3b-debug.apk"

[preset.0.options]

custom_template/debug=""
custom_template/release=""

; Template export (no Gradle build). The Standard export templates are pinned
; in ENGINE_VERSION.lock.
gradle_build/use_gradle_build=false
gradle_build/export_format=0

architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86=false
architectures/x86_64=false

version/code=5
version/name="0.3.2-g3b"

package/unique_name="com.yoseftext.layersort.dev"
package/name="Layer Sort G3-B"
package/signed=true

screen/immersive_mode=true

; Empty on purpose: CI injects the stable debug keystore path and credential
; values at export time. Never commit signing material.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
