name: agent-guard-tests

# Verifies checked-out source; pull_request uses the synthetic PR merge.
# 1) guard tests: preflight pin check, scope/commit/.agents post-checks, fail-closed
#    behaviour, with isolated content-addressed task snapshots.
# 2) policy unit tests: in-repo policy, hermetic on a fresh checkout (local-worktree
#    fixtures are skipped explicitly and reported as SKIP).
# Uploads no artifacts, so it is independent of the GitHub Actions artifact quota.

"on":
  pull_request:
  push:
    branches: ["feat/agent-system-clean"]
  workflow_dispatch:

concurrency:
  group: agent-guard-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-guard-tests:
    name: Agent system — guard and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Snapshot and Hook structure regression tests
        run: node --test tools/agent-guard/test-state.mjs tools/agent-guard/test-launcher.mjs

      - name: Guard tests (preflight, scope, commit and .agents checks, fail-closed)
        run: bash tools/agent-guard/test-guard.sh

      - name: Policy unit tests (in-repo policy, hermetic checkout)
        env:
          LS_PROJECT_ROOT: ${{ github.workspace }}
        run: bash .agents/plugins/layer-sort-agent-kit/scripts/test-policy.sh
