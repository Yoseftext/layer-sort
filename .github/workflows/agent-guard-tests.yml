name: agent-guard-tests

# Verifies checked-out source; pull_request uses the synthetic PR merge.
# 1) guard tests: preflight pin check, scope/commit/.agents post-checks, fail-closed
#    behaviour, with isolated content-addressed task snapshots.
# 2) policy unit tests: in-repo policy, hermetic on a fresh checkout (local-worktree
#    fixtures are skipped explicitly and reported as SKIP).
# Uploads no artifacts, so it is independent of the GitHub Actions artifact quota.

"on":
  pull_request:
  push:
    branches: ["feat/agent-system-clean"]
  workflow_dispatch:

concurrency:
  group: agent-guard-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-guard-tests:
    name: Agent system — guard and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Snapshot and Hook structure regression tests
        run: node --test tools/agent-guard/test-state.mjs tools/agent-guard/test-launcher.mjs

      - name: Compatibility recovery tests (hermetic)
        run: |
          node --test --test-name-pattern='model discovery|retries quota|diagnoses sanitized|one recovery retry|never retries|reports quota' tools/agent-guard/test-compatibility.mjs
          node --test --test-name-pattern='^policy fingerprint changes' tools/agent-guard/test-compatibility.mjs
          node --test tools/agent-guard/test-repair-coordinator.mjs

      - name: Device QA and APK provenance tests (no device)
        run: bash tools/device-tests/test-wrapper.sh

      - name: Guard tests (preflight, scope, commit and .agents checks, fail-closed)
        run: bash tools/agent-guard/test-guard.sh

      - name: Godot runtime compatibility and executable integrity
        run: node --test tools/godot-runtime/test-compat.mjs

      - name: Policy unit tests (in-repo policy, hermetic checkout)
        env:
          LS_PROJECT_ROOT: ${{ github.workspace }}
        run: bash .agents/plugins/layer-sort-agent-kit/scripts/test-policy.sh

      - name: Install Python 3.13 for optional visual QA
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Exercise pinned visual matcher (synthetic images only)
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r tools/visual-qa/requirements-py313-linux.txt
          python -I -m unittest discover -s tests -p test_device_qa_visual.py -v
