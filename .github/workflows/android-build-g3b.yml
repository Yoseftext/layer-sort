name: android-build-g3b

# G3-B: reuse the pinned G1 toolchain to build and test the Classic prototype.
# Actions, then verify it independently of the export exit code. The engine,
# templates, SDK and ABI are pinned in ENGINE_VERSION.lock.

"on":
  push:
    branches: ["feat/g3b-progression", "feat/g3b-remediation", "feat/g4-gameplay-visual", "feat/cloud-visual-qa", "feat/g4-visual-production", "feat/g3c-classic-campaign", "feat/g3c-player-ux", "feat/g3d-player-flow", "feat/g4b-optical-clarity", "feat/real-game-ui", "chore/g4-ci-trigger-fix", "main"]
  pull_request:
    branches: ["feat/g3a-navigation", "feat/g3b-progression", "feat/g3b-remediation", "feat/g4-gameplay-visual", "feat/cloud-visual-qa", "feat/g4-visual-production", "feat/g3c-classic-campaign", "feat/g3c-player-ux", "feat/g3d-player-flow", "feat/g4b-optical-clarity", "feat/real-game-ui", "main"]
  workflow_dispatch:

concurrency:
  group: android-build-g3b-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android-g3b:
    name: Godot 4.7.2 Standard — G3-B navigation APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned JDK 17.0.21+9 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"

      - name: Read pinned versions and assert Standard GDScript scope
        run: |
          set -euo pipefail
          mkdir -p logs
          grep -q '^godot_edition=standard$' ENGINE_VERSION.lock
          grep -q '^renderer=gl_compatibility$' ENGINE_VERSION.lock
          grep -q '^orientation=portrait$' ENGINE_VERSION.lock
          grep -q 'config/features=PackedStringArray("4.7", "GL Compatibility")' project.godot
          grep -q 'window/handheld/orientation=1' project.godot
          grep -q 'renderer/rendering_method="gl_compatibility"' project.godot
          if grep -q 'config/features=.*C#' project.godot; then
            echo "::error::project.godot still advertises a C# feature set."
            exit 1
          fi
          declare -A map=(
            [godot_version]=GODOT_VERSION
            [godot_channel]=GODOT_CHANNEL
            [godot_edition]=GODOT_EDITION
            [godot_version_string]=GODOT_VERSION_STRING
            [godot_linux_zip]=GODOT_LINUX_ZIP
            [godot_linux_zip_sha512]=GODOT_LINUX_ZIP_SHA512
            [godot_export_templates]=GODOT_EXPORT_TEMPLATES
            [godot_export_templates_sha512]=GODOT_EXPORT_TEMPLATES_SHA512
            [android_template_dir]=ANDROID_TEMPLATE_DIR
            [renderer]=RENDERER
            [orientation]=ORIENTATION
            [reference_viewport]=REFERENCE_VIEWPORT
            [abi]=ABI
            [min_sdk]=MIN_SDK
            [target_sdk]=TARGET_SDK
            [build_tools]=BUILD_TOOLS
            [compile_sdk]=COMPILE_SDK
          )
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            name="${map[$key]:-}"
            [[ -n "$name" ]] || continue
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < ENGINE_VERSION.lock
          cat ENGINE_VERSION.lock | tee logs/engine-lock.txt
          java -version 2>&1 | tee logs/toolchain.txt
          echo "godot edition: standard (non-.NET)" | tee -a logs/toolchain.txt

      - name: Install pinned Godot Standard editor
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLo SHA512-SUMS.txt \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/SHA512-SUMS.txt"
          curl -sSLo "${GODOT_LINUX_ZIP}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_LINUX_ZIP}"
          echo "${GODOT_LINUX_ZIP_SHA512}  ${GODOT_LINUX_ZIP}" | sha512sum -c -
          sha512sum -c <(grep "  ${GODOT_LINUX_ZIP}$" SHA512-SUMS.txt)
          unzip -q "${GODOT_LINUX_ZIP}" -d godot-standard
          GODOT_BIN="$(find godot-standard -type f -name "Godot_v${GODOT_VERSION}_linux.x86_64" -print -quit)"
          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Godot Standard editor binary not found in zip."
            exit 1
          fi
          if [ -d "$(dirname "$GODOT_BIN")/GodotSharp" ]; then
            echo "::error::This is a .NET distribution; G1 requires Godot Standard."
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          INSTALL_DIR=/opt/godot-4.7.2-standard
          sudo mkdir -p "$(dirname "$INSTALL_DIR")"
          if [ -e "$INSTALL_DIR" ]; then
            echo "::error::$INSTALL_DIR already exists; refusing to overwrite."
            exit 1
          fi
          sudo mv "$(dirname "$GODOT_BIN")" "$INSTALL_DIR"
          sudo ln -sfn "$INSTALL_DIR/$(basename "$GODOT_BIN")" /usr/local/bin/godot
          test -x /usr/local/bin/godot
          test ! -d "$INSTALL_DIR/GodotSharp"
          GODOT_VERSION_OUTPUT="$(godot --version 2>&1)"
          echo "godot --version: $GODOT_VERSION_OUTPUT" | tee -a "$GITHUB_WORKSPACE/logs/toolchain.txt"
          case "$GODOT_VERSION_OUTPUT" in
            "${GODOT_VERSION_STRING}"*) ;;
            *) echo "::error::unexpected Godot version: $GODOT_VERSION_OUTPUT"; exit 1 ;;
          esac
          if [[ "$GODOT_VERSION_OUTPUT" == *mono* ]]; then
            echo "::error::Mono runtime detected; G1 requires Standard."
            exit 1
          fi

      - name: Install matching Standard export templates
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLo "${GODOT_EXPORT_TEMPLATES}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_EXPORT_TEMPLATES}"
          echo "${GODOT_EXPORT_TEMPLATES_SHA512}  ${GODOT_EXPORT_TEMPLATES}" | sha512sum -c -
          sha512sum -c <(grep "  ${GODOT_EXPORT_TEMPLATES}$" SHA512-SUMS.txt)
          unzip -q "${GODOT_EXPORT_TEMPLATES}" -d export-templates-unpack
          test -s export-templates-unpack/templates/android_debug.apk || {
            echo "::error::Standard export templates lack android_debug.apk."; exit 1; }
          DEST="$HOME/.local/share/godot/export_templates/${ANDROID_TEMPLATE_DIR}"
          if [ -e "$DEST" ]; then
            echo "::error::$DEST already exists; refusing to overwrite."
            exit 1
          fi
          mkdir -p "$(dirname "$DEST")"
          mv export-templates-unpack/templates "$DEST"
          test -s "$DEST/android_debug.apk"
          test "$(cat "$DEST/version.txt")" = "${GODOT_VERSION_STRING%.official}" || {
            echo "::error::Export template version mismatch: $(cat "$DEST/version.txt")"
            exit 1
          }
          {
            echo "Export template directory: $DEST"
            echo "Template version: $(cat "$DEST/version.txt")"
            ls "$DEST" | head -40
          } | tee -a "$GITHUB_WORKSPACE/logs/toolchain.txt"

      - name: Install Android SDK (pinned build-tools; platform-tools floating)
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo chown -R "$USER" /opt/android-sdk
          cd "$RUNNER_TEMP"
          curl -sSLo cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  cmdline-tools.zip" | sha256sum -c -
          unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          if [ ! -d /opt/android-sdk/cmdline-tools/cmdline-tools ]; then
            echo "::error::unexpected cmdline-tools zip layout"
            exit 1
          fi
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"
          SDKM=/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
          # 'yes' is killed by SIGPIPE (exit 141) when sdkmanager closes stdin.
          set +o pipefail
          rc=0
          yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --licenses > "$GITHUB_WORKSPACE/logs/sdk-licenses.log" 2>&1 || rc=$?
          set -o pipefail
          if [ "$rc" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed (sdkmanager exit '$rc')."
            tail -n 20 "$GITHUB_WORKSPACE/logs/sdk-licenses.log"
            exit 1
          fi
          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            2>&1 | tail -n 20 | tee "$GITHUB_WORKSPACE/logs/android-sdk.txt"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

      - name: Restore the stable Android debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing debug signing secrets. Set ANDROID_DEBUG_KEYSTORE_B64, ANDROID_DEBUG_KEYSTORE_PASSWORD and ANDROID_DEBUG_KEY_ALIAS."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/android-debug.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          ACTUAL_CERT="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')"
          EXPECTED_CERT="$(tr -d '[:space:]' < tools/device-tests/expected-debug-cert.sha256 | tr 'A-F' 'a-f')"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Debug keystore certificate does not match tools/device-tests/expected-debug-cert.sha256."
            exit 1
          fi
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Debug keystore restored; certificate fingerprint matches the committed expected value." | tee logs/keystore.txt

      - name: Import project headlessly
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee logs/import.log
          if grep -q 'SCRIPT ERROR' logs/import.log; then
            echo "::error::Script error during import."
            exit 1
          fi

      - name: Configure Godot editor settings (Android, Java, debug keystore)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME:-}" ]; then echo "::error::JAVA_HOME is not set"; exit 1; fi
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          key_values = {
              "export/android/android_sdk_path": "/opt/android-sdk",
              "export/android/java_sdk_path": os.environ["JAVA_HOME"].rstrip("/"),
              "export/android/debug_keystore": os.environ["ANDROID_DEBUG_KEYSTORE_PATH"],
              "export/android/debug_keystore_user": os.environ["KEY_ALIAS"],
              "export/android/debug_keystore_pass": os.environ["KEYSTORE_PASSWORD"],
          }

          cfg_dir = Path(os.environ["HOME"]) / ".config" / "godot"
          cfg_dir.mkdir(parents=True, exist_ok=True)
          candidates = sorted(g for g in cfg_dir.glob("editor_settings-4*.tres"))
          target = candidates[-1] if candidates else cfg_dir / "editor_settings-4.7.tres"

          if target.exists():
              text = target.read_text(encoding="utf-8")
              if 'type="EditorSettings"' not in text:
                  print("::error::%s exists but is not an EditorSettings resource" % target)
                  sys.exit(1)
              action = "patched editor-generated settings"
          else:
              text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
              action = "created fallback EditorSettings (editor had not generated one)"

          def upsert(text, key, value):
              pat = re.compile(r"^" + re.escape(key) + r"\s*=.*$", re.MULTILINE)
              line = '%s = "%s"' % (key, value)
              if pat.search(text):
                  return pat.sub(lambda _: line, text, count=1)
              if not re.search(r"^\[resource\]\s*$", text, re.MULTILINE):
                  print("::error::settings file has no [resource] section")
                  sys.exit(1)
              return re.sub(r"^\[resource\]\s*$",
                            "[resource]\n\n" + line,
                            text, count=1, flags=re.MULTILINE)

          for key, value in key_values.items():
              text = upsert(text, key, value)

          target.write_text(text, encoding="utf-8")
          missing = [k for k in key_values if k not in target.read_text(encoding="utf-8")]
          if missing:
              print("::error::failed to set editor settings keys: %s" % missing)
              sys.exit(1)
          print("OK: %s -> %s" % (action, target))
          print("OK: %s" % ", ".join(sorted(key_values)))
          PY

      - name: Headless GDScript smoke test
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee logs/smoke.log
          grep -q "Godot Engine v${GODOT_VERSION_STRING}" logs/smoke.log || {
            echo "::error::Pinned Godot startup line missing from headless smoke test."; exit 1; }
          grep -q "LAYER_SORT_G3_HOME_READY" logs/smoke.log || {
            echo "::error::GDScript ready marker missing from headless smoke test."; exit 1; }
          if grep -q "SCRIPT ERROR" logs/smoke.log; then
            echo "::error::Script error during headless smoke test."
            exit 1
          fi

      - name: Run G2 Classic rules unit suite
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/g2/classic_rules_test.gd 2>&1 | tee logs/g2-rules.log
          grep -q 'G2_RULE_TESTS status=PASS' logs/g2-rules.log
          if grep -Eq 'SCRIPT ERROR|RULE_FAIL' logs/g2-rules.log; then exit 1; fi

      - name: Run G3-A navigation regression
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/g3a/navigation_test.gd 2>&1 | tee logs/g3a-navigation.log
          grep -q 'G3A_NAV_TESTS status=PASS' logs/g3a-navigation.log
          if grep -Eq 'SCRIPT ERROR|G3A_FAIL' logs/g3a-navigation.log; then exit 1; fi

      - name: Run G3-B navigation suite
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/g3b/navigation_test.gd 2>&1 | tee logs/g3b-navigation.log
          grep -q 'G3B_NAV_TESTS status=PASS' logs/g3b-navigation.log
          if grep -Eq 'SCRIPT ERROR|G3B_NAV_FAIL' logs/g3b-navigation.log; then exit 1; fi

      - name: Run G3-B progression and save suite
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/g3b/progression_test.gd 2>&1 | tee logs/g3b-progression.log
          grep -q 'G3B_TESTS status=PASS' logs/g3b-progression.log
          if grep -Eq 'SCRIPT ERROR|G3B_FAIL' logs/g3b-progression.log; then exit 1; fi

      - name: Run G3-B remediation and APK-report tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/g3b/remediation_test.gd 2>&1 | tee logs/g3b-remediation.log
          grep -q 'G3B_REMEDIATION_TESTS status=PASS' logs/g3b-remediation.log
          if grep -Eq 'SCRIPT ERROR|G3B_REMEDIATION_FAIL' logs/g3b-remediation.log; then exit 1; fi
          python3 -m unittest tests/test_apk_report.py

      - name: Verify gameplay presentation and capture desktop Godot renders
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/visual/gameplay_visual_test.gd 2>&1 | tee logs/visual-tests.log
          grep -q 'VISUAL_TESTS status=PASS' logs/visual-tests.log
          godot --headless --audio-driver Dummy --path . --script res://tests/visual/production_test.gd 2>&1 | tee logs/g4-production.log
          grep -q 'G4_PRODUCTION_TESTS status=PASS' logs/g4-production.log
          if grep -Eq 'SCRIPT ERROR|G4_PRODUCTION_FAIL' logs/g4-production.log; then exit 1; fi
          python3 -m unittest tests/test_audio_assets.py
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://tests/feedback/feedback_test.gd 2>&1 | tee logs/feedback.log
          grep -q "FEEDBACK_TESTS PASS" logs/feedback.log
          VISUAL_CAPTURE_DIR="$RUNNER_TEMP/layersort-feedback-captures" timeout 90s xvfb-run -a godot --audio-driver Dummy --path . --script res://tests/feedback/feedback_visual_test.gd 2>&1 | tee logs/feedback-visual.log
          grep -q "FEEDBACK_VISUAL PASS" logs/feedback-visual.log
          if grep -Eq "SCRIPT ERROR|FEEDBACK_FAIL|FEEDBACK_VISUAL_FAIL" logs/feedback*.log; then exit 1; fi
          python3 tools/content/verify_campaign.py > logs/campaign-solver.json
          timeout 120s godot --headless --path . --script res://tests/campaign/campaign_test.gd 2>&1 | tee logs/campaign.log
          grep -q "CAMPAIGN_TESTS PASS" logs/campaign.log
          if grep -Eq "SCRIPT ERROR|Assertion failed" logs/campaign.log; then exit 1; fi
          timeout 60s godot --headless --path . --script res://tests/g3d/player_flow_test.gd 2>&1 | tee logs/g3d-player-flow.log
          grep -q 'G3D_FLOW_TESTS status=PASS' logs/g3d-player-flow.log
          if grep -Eq 'SCRIPT ERROR|G3D_FLOW_FAIL' logs/g3d-player-flow.log; then exit 1; fi
          VISUAL_CAPTURE_DIR="$RUNNER_TEMP/layersort-real-ui-captures" timeout 90s xvfb-run -a godot --audio-driver Dummy --path . --script res://tests/visual/real_ui_test.gd 2>&1 | tee logs/real-ui.log
          grep -q "REAL_UI_TESTS PASS" logs/real-ui.log
          if grep -Eq "SCRIPT ERROR|Assertion failed" logs/real-ui.log; then exit 1; fi
          VISUAL_CAPTURE_DIR="$RUNNER_TEMP/layersort-optical-captures" timeout 120s xvfb-run -a godot --audio-driver Dummy --path . --script res://tests/visual/optical_clarity_test.gd 2>&1 | tee logs/optical-visual.log
          grep -q "OPTICAL_VISUAL PASS" logs/optical-visual.log
          if grep -Eq "SCRIPT ERROR|Assertion failed" logs/optical-visual.log; then exit 1; fi
          VISUAL_CAPTURE_DIR="$RUNNER_TEMP/layersort-campaign-captures" timeout 120s xvfb-run -a godot --audio-driver Dummy --path . --script res://tests/campaign/campaign_visual_test.gd 2>&1 | tee logs/campaign-visual.log
          grep -q "CAMPAIGN_VISUAL PASS" logs/campaign-visual.log
          VISUAL_CAPTURE_DIR="$RUNNER_TEMP/layersort-visual-captures" xvfb-run -a godot --audio-driver Dummy --path . --script res://tests/visual/gameplay_visual_test.gd 2>&1 | tee logs/visual-render.log
          grep -q 'VISUAL_TESTS status=PASS' logs/visual-render.log
          QA_SOURCE_COMMIT="$GITHUB_SHA" VISUAL_CAPTURE_DIR="$RUNNER_TEMP/layersort-cloud-captures" timeout 120s xvfb-run -a godot --audio-driver Dummy --path . --script res://tests/visual/cloud_smoke_test.gd 2>&1 | tee logs/cloud-visual-smoke.log
          grep -q 'CLOUD_VISUAL_TESTS status=PASS' logs/cloud-visual-smoke.log
          if grep -Eq 'SCRIPT ERROR|CLOUD_VISUAL_FAIL' logs/cloud-visual-smoke.log; then exit 1; fi

      - name: Export Android G3-B debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          KEYSTORE_PASSWORD_FOR_KEY: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          trap 'git checkout -- export_presets.cfg' EXIT
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text(encoding="utf-8")
          values = {
              "keystore/debug": os.environ["ANDROID_DEBUG_KEYSTORE_PATH"],
              "keystore/debug_user": os.environ["KEY_ALIAS"],
              "keystore/debug_password": os.environ["KEYSTORE_PASSWORD"],
          }
          for key, value in values.items():
              line = '%s="%s"' % (key, value)
              pattern = re.compile(r"^" + re.escape(key) + r"=.*$", re.MULTILINE)
              if pattern.search(text):
                  text = pattern.sub(line, text, count=1)
              else:
                  text += line + "\n"
          path.write_text(text, encoding="utf-8")
          print("Injected debug keystore path and credentials into export preset.")
          PY
          godot --headless --path . --export-debug "Android G3-B Debug" build/layer-sort-g3b-debug.apk 2>&1 | tee logs/export.log
          test -s build/layer-sort-g3b-debug.apk || {
            echo "::error::APK was not produced."; exit 1; }
          unzip -t build/layer-sort-g3b-debug.apk > logs/apk-zip-test.log || {
            echo "::error::APK is not a valid zip."; exit 1; }
          unzip -l build/layer-sort-g3b-debug.apk > logs/apk-contents.log
          for required in content/levels/level_001.json content/levels/level_002.json content/levels/catalog.json content/about/credits.json scenes/navigation/root.tscn.remap; do
            unzip -Z1 build/layer-sort-g3b-debug.apk | grep -qx "assets/$required" || {
              echo "::error::APK is missing gameplay resource $required"; exit 1; }
          done
          if unzip -Z1 build/layer-sort-g3b-debug.apk | grep -Eq '^assets/(docs|tests|tools)/'; then
            echo "::error::APK contains docs, tests or tooling that must not ship."
            unzip -Z1 build/layer-sort-g3b-debug.apk | grep -E '^assets/(docs|tests|tools)/' | head -20
            exit 1
          fi
          echo 'APK packaging scope PASS: levels present; docs/tests/tools absent.' | tee logs/apk-packaging.log
          sha256sum build/layer-sort-g3b-debug.apk > logs/apk-sha256.txt
          aapt2 dump badging build/layer-sort-g3b-debug.apk > logs/apk-badging.txt
          aapt2 dump xmltree --file AndroidManifest.xml build/layer-sort-g3b-debug.apk > logs/android-manifest.txt
          apksigner verify --verbose --print-certs build/layer-sort-g3b-debug.apk > logs/apk-signing.txt
          LAYER_SORT_VERSION_NAME=0.3.2-g3b LAYER_SORT_VERSION_CODE=5 tools/verify-apk.sh build/layer-sort-g3b-debug.apk tools/device-tests/expected-debug-cert.sha256 | tee logs/apk-verification.txt
          grep -q 'config/version="0.3.2-g3b"' project.godot
          grep -q 'Version 0.3.2-g3b' scripts/ui/ui_text.gd
          grep -q 'الإصدار 0.3.2-g3b' scripts/ui/ui_text.gd
          python3 tools/apk-report.py build/layer-sort-g3b-debug.apk --budget-mib "${APK_BUDGET_MIB:-32}" --verification logs/apk-verification.txt --output logs/apk-report.json
          cat logs/apk-report.json | python3 -c 'import json,sys; r=json.load(sys.stdin); print("APK_SIZE_BUDGET_PASS bytes=%s budget_mib=%s" % (r["bytes"], r["budget_mib"]))'


      - name: Publish APK summary
        run: |
          {
            echo "### Layer Sort G3-B APK — headless tests + debug build only (device QA separate)"
            echo '```'
            cat logs/apk-verification.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect rendered evidence after export
        run: |
          mkdir -p logs/real-ui-screenshots
          cp "$RUNNER_TEMP/layersort-real-ui-captures/"*.png logs/real-ui-screenshots/
          mkdir -p logs/optical-screenshots
          cp "$RUNNER_TEMP/layersort-optical-captures/"*.png logs/optical-screenshots/
          mkdir -p logs/feedback-screenshots
          cp "$RUNNER_TEMP/layersort-feedback-captures/"*.png logs/feedback-screenshots/
          mkdir -p logs/campaign-screenshots
          cp "$RUNNER_TEMP/layersort-campaign-captures/"*.png logs/campaign-screenshots/
          mkdir -p logs/screenshots
          cp "$RUNNER_TEMP/layersort-visual-captures/"*.png logs/screenshots/
          mkdir -p logs/cloud-screenshots
          cp "$RUNNER_TEMP/layersort-cloud-captures/"*.png logs/cloud-screenshots/
          cp "$RUNNER_TEMP/layersort-cloud-captures/capture-index.json" logs/cloud-capture-index.json

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layer-sort-g3b-debug-apk
          path: build/layer-sort-g3b-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and verification logs (also on failed runs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layer-sort-g3b-build-logs
          path: |
            logs/*.txt
            logs/*.log
            logs/*.json
            logs/real-ui-screenshots/*.png
            logs/optical-screenshots/*.png
            logs/feedback-screenshots/*.png
            logs/campaign-screenshots/*.png
            logs/screenshots/*.png
            logs/cloud-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
